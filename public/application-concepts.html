<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>BASELN application design review</title></head><body style="margin:0;background:#111317"><nav style="display:flex;gap:10px;flex-wrap:wrap;padding:16px;background:#111317" aria-label="Design directions"><button onclick="choose(0)">Minimal Athletic Editorial</button><button onclick="choose(1)">Modern Heritage Training Club</button><button onclick="choose(2)">Contemporary Premium Coaching</button></nav><style>
#baseln-directions .bs-stage{background:#111317;color:#f4f4f2;padding:18px;min-height:1000px;font-family:Arial,sans-serif;box-sizing:border-box}
#baseln-directions .bs-layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px;align-items:start}
#baseln-directions .bs-label{font:11px Arial,sans-serif;letter-spacing:.12em;color:#a4b8c8;margin:0 0 12px;text-transform:uppercase}
#baseln-directions .bs-window{background:#07080a;color:#f4f4f2;min-width:0;overflow:hidden}
#baseln-directions .bs-chrome{padding:20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff15;gap:10px}
#baseln-directions .bs-logo{font:22px Georgia,serif;letter-spacing:.15em}#baseln-directions .bs-back{font:11px Arial,sans-serif;color:#a4b8c8}
#baseln-directions .bs-intro{padding:28px 28px 20px;max-width:640px;margin:auto}#baseln-directions .bs-intro h2{font:36px/1.05 Georgia,serif;letter-spacing:-.03em;margin:10px 0 14px;font-weight:400;color:inherit}
#baseln-directions .bs-intro p{font:14px/1.5 Arial,sans-serif;color:#c3c9ce;margin:8px 0}#baseln-directions .bs-intro small{font:10px Arial,sans-serif;letter-spacing:.13em;color:#a4b8c8}
#baseln-directions .bs-photo{width:100%;height:140px;object-fit:cover;object-position:center 38%;filter:grayscale(1);display:block}
#baseln-directions .bs-form{max-width:640px;padding:22px 28px 30px;margin:auto}
#baseln-directions .bs-meta{display:flex;justify-content:space-between;font:10px Arial,sans-serif;letter-spacing:.1em;color:#a4b8c8}
#baseln-directions .bs-progress{display:flex;gap:5px;margin:12px 0 24px}#baseln-directions .bs-progress span{height:2px;background:#ffffff20;flex:1}#baseln-directions .bs-progress span:first-child{background:#a4b8c8}
#baseln-directions .bs-question{font:25px/1.15 Georgia,serif;margin:0 0 10px;color:inherit}#baseln-directions .bs-help{font:13px/1.5 Arial,sans-serif;color:#c3c9ce;margin-bottom:20px}
#baseln-directions .bs-choice{width:100%;font:14px Arial,sans-serif;color:inherit;background:transparent;border:1px solid #ffffff24;display:flex;justify-content:space-between;text-align:left;padding:15px 14px;min-height:48px;margin:8px 0;cursor:pointer;box-sizing:border-box}
#baseln-directions .bs-choice[aria-pressed=true]{border-color:#a4b8c8;background:#a4b8c820}#baseln-directions .bs-choice:after{content:'○';color:#a4b8c8}#baseln-directions .bs-choice[aria-pressed=true]:after{content:'●'}
#baseln-directions .bs-next{background:#a4b8c8;color:#07080a;border:0;width:100%;padding:16px;font:11px Arial,sans-serif;letter-spacing:.15em;margin-top:18px;text-align:center}
#baseln-directions .bs-foot{color:#b5bec5;font:11px/1.5 Arial,sans-serif;margin-top:18px;text-align:center}
#baseln-directions button:focus-visible{outline:2px solid #a4b8c8;outline-offset:3px}
#baseln-directions .bs-mobile .bs-chrome{padding:16px}#baseln-directions .bs-mobile .bs-back{display:none}#baseln-directions .bs-mobile .bs-intro{padding:24px 18px 14px}#baseln-directions .bs-mobile .bs-intro h2{font-size:29px}#baseln-directions .bs-mobile .bs-form{padding:20px 18px 26px}#baseln-directions .bs-mobile .bs-photo{height:112px}#baseln-directions .bs-mobile .bs-question{font-size:24px}#baseln-directions .bs-mobile .bs-meta{font-size:9px}
#baseln-directions .bs-heritage .bs-intro{text-align:center;padding-top:24px}#baseln-directions .bs-heritage .bs-intro h2{text-transform:uppercase;font:38px/.98 Georgia,serif}#baseln-directions .bs-heritage .bs-window{background:#d9dcdd;color:#171b20}#baseln-directions .bs-heritage .bs-chrome{border-color:#171b2025}#baseln-directions .bs-heritage .bs-intro p,#baseln-directions .bs-heritage .bs-help,#baseln-directions .bs-heritage .bs-foot{color:#424e57}#baseln-directions .bs-heritage .bs-meta,#baseln-directions .bs-heritage .bs-intro small,#baseln-directions .bs-heritage .bs-back{color:#445a6b}#baseln-directions .bs-heritage .bs-choice{border-color:#171b2040;background:#f4f4f280}#baseln-directions .bs-heritage .bs-choice:after{color:#445a6b}#baseln-directions .bs-heritage .bs-choice[aria-pressed=true]{border-color:#445a6b;background:#a4b8c860}#baseln-directions .bs-heritage .bs-progress span{background:#171b2025}#baseln-directions .bs-heritage .bs-progress span:first-child{background:#445a6b}#baseln-directions .bs-heritage .bs-next{background:#171b20;color:#f4f4f2}#baseln-directions .bs-heritage .bs-mobile .bs-intro h2{font-size:28px}
#baseln-directions .bs-premium .bs-hero{position:relative}#baseln-directions .bs-premium .bs-photo{height:250px;filter:grayscale(1) brightness(.4)}#baseln-directions .bs-premium .bs-intro{position:absolute;bottom:0;left:0;right:0}#baseln-directions .bs-premium .bs-choice{border-width:0 0 1px;padding-left:0;margin:0;min-height:54px}#baseln-directions .bs-premium .bs-mobile .bs-photo{height:240px}#baseln-directions .bs-premium .bs-intro h2{max-width:420px}
@media(max-width:760px){#baseln-directions .bs-layout{grid-template-columns:1fr}#baseln-directions .bs-mobile{max-width:330px;margin:20px auto 0;width:100%}#baseln-directions .bs-stage{min-height:1920px;padding:10px}#baseln-directions .bs-intro h2{font-size:30px}}
</style>
<div id="baseln-directions" class="standalone-concepts" aria-label="BASELN application design directions">
<section data-variant="Minimal Athletic Editorial"><div class="bs-stage"><div class="bs-layout"><div><p class="bs-label">Desktop · Minimal Athletic Editorial</p><div class="bs-window" data-title="LET’S TALK ABOUT YOUR TRAINING." data-style="minimal"></div></div><div class="bs-mobile"><p class="bs-label">Mobile</p><div class="bs-window" data-title="LET’S TALK ABOUT YOUR TRAINING." data-style="minimal"></div></div></div></div></section>
<section data-variant="Modern Heritage Training Club" hidden><div class="bs-stage bs-heritage"><div class="bs-layout"><div><p class="bs-label">Desktop · Modern Heritage Training Club</p><div class="bs-window" data-title="TRAINING. WITH INTENT." data-style="heritage"></div></div><div class="bs-mobile"><p class="bs-label">Mobile</p><div class="bs-window" data-title="TRAINING. WITH INTENT." data-style="heritage"></div></div></div></div></section>
<section data-variant="Contemporary Premium Coaching" hidden><div class="bs-stage bs-premium"><div class="bs-layout"><div><p class="bs-label">Desktop · Contemporary Premium Coaching</p><div class="bs-window" data-title="START WITH A CONVERSATION." data-style="premium"></div></div><div class="bs-mobile"><p class="bs-label">Mobile</p><div class="bs-window" data-title="START WITH A CONVERSATION." data-style="premium"></div></div></div></div></section>
</div>
<template id="baseln-concept-template">
<div class="bs-chrome"><span class="bs-logo">BASELN</span><span class="bs-back">← Back to BASELN</span></div>
<div class="bs-hero"><div class="bs-intro"><small>PRIVATE COACHING / APPLICATION</small><h2></h2><p>Tell us what you’re working towards.<br>We’ll take it from there.</p><small>2–3 MINUTES · NO COMMITMENT</small></div><img class="bs-photo" src="/media/baseln-front-squat-coaching.png" alt="Aian coaching a front squat"></div>
<div class="bs-form"><div class="bs-meta"><span>01 / YOUR GOALS</span><span>STEP 1 OF 5</span></div><div class="bs-progress" aria-label="Step 1 of 5"><span></span><span></span><span></span><span></span><span></span></div><h3 class="bs-question">What are you working towards?</h3><p class="bs-help">Select everything that applies.</p><div class="bs-answers"></div><div class="bs-next">CONTINUE →</div><div class="bs-foot">Design preview · No application is submitted.<br>Privacy · Terms · Training disclaimer</div></div>
</template>
<script>
(()=>{const root=document.getElementById('baseln-directions');const template=document.getElementById('baseln-concept-template');for(const panel of root.querySelectorAll('.bs-window')){panel.append(template.content.cloneNode(true));panel.querySelector('h2').textContent=panel.dataset.title;const answers=panel.querySelector('.bs-answers');for(const goal of ['Lose body fat','Build muscle','Get stronger','Improve conditioning','Prepare for an event','Return to training']){const b=document.createElement('button');b.type='button';b.className='bs-choice';b.textContent=goal;b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>b.setAttribute('aria-pressed',String(b.getAttribute('aria-pressed')!=='true')));answers.append(b)}}})();
</script>
<script>function choose(n){document.querySelectorAll('[data-variant]').forEach((s,i)=>s.hidden=i!==n)}</script></body></html>
